<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>
  
  <link rel="stylesheet" href="style.css">
<style>
  .group { text-align: left; margin: 10px; padding: 10px;
           background: white; border-radius: 10px; }
  .group img { width: 90px; margin: 4px; border-radius: 6px; }
  textarea { width: 90%; padding: 10px; font-size: 16px; border-radius: 8px; }
  #adminHome button { margin: 5px; }
  .waBtn { display: inline-block; background: #0a7d2e; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 18px; margin: 5px; }
</style>
</head>
<body>

<div id="adminLogin" class="screen">
  <h1>Admin Login</h1>
  <input id="adminEmail" type="email" placeholder="Admin email">
  <br><br>
  <input id="adminPass" type="password" placeholder="Password">
  <br><br>
  <button id="adminLoginBtn">Log in</button>
  <p id="adminMsg"></p>
</div>

<div id="adminHome" class="screen hidden">
  <h1>Admin</h1>
  <button id="adminLogout">Log out</button>
  <br><br>
  <button id="showNotes">JSS Notes</button>
  <button id="showTopics">SS Topics</button>
  <button id="showResults">Results</button>
  <button id="showStudents">Students</button>
  <div id="quizForm" class="group hidden">
  <h3 id="quizFor"></h3>
  <input id="quizTitle" placeholder="Quiz title">
  <br><br>
  <textarea id="quizJson" rows="8" placeholder="Paste the AI's questions here"></textarea>
  <br><br>
  <button id="sendQuiz">Send quiz</button>
  <button id="cancelQuiz">Cancel</button>
  <p id="quizMsg"></p>
</div>
  
  <div id="adminList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const db = supabase.createClient(
    "https://smgjxokbiielnvgduqty.supabase.co",
    "sb_publishable_T_CKX3uRL-xNfVrFOpHZPQ_eoXCdP6F"
  );

  function showAdmin(on) {
    document.getElementById("adminLogin").classList.toggle("hidden", on);
    document.getElementById("adminHome").classList.toggle("hidden", !on);
  }

  async function startAdmin() {
    const ok = await db.rpc("is_admin");
    if (ok.error || ok.data !== true) {
      await db.auth.signOut();
      showAdmin(false);
      document.getElementById("adminMsg").innerText =
        "This account is not an admin.";
      return;
    }
    showAdmin(true);
    loadNotes();
  }

  document.getElementById("adminLoginBtn").addEventListener("click", async function () {
    const msg = document.getElementById("adminMsg");
    msg.innerText = "Logging in...";
    const r = await db.auth.signInWithPassword({
      email: document.getElementById("adminEmail").value.trim(),
      password: document.getElementById("adminPass").value
    });
    if (r.error) {
      msg.innerText = "Wrong email or password.";
      return;
    }
    msg.innerText = "";
    startAdmin();
  });

  document.getElementById("adminLogout").addEventListener("click", async function () {
    await db.auth.signOut();
    showAdmin(false);
  });

  document.getElementById("showNotes").addEventListener("click", loadNotes);
  document.getElementById("showTopics").addEventListener("click", loadTopics);

  function groupBy(rows) {
    const out = {};
    for (let i = 0; i < rows.length; i++) {
      const key = rows[i].school + " - " + rows[i].class;
      if (!out[key]) {
        out[key] = [];
      }
      out[key].push(rows[i]);
    }
    return out;
  }

  async function loadNotes() {
    const box = document.getElementById("adminList");
    box.textContent = "Loading...";
    const res = await db.from("notes").select("*")
      .order("created_at", { ascending: false });
    box.innerHTML = "";
    if (res.error) {
      box.textContent = res.error.message;
      return;
    }
    const groups = groupBy(res.data);
    const keys = Object.keys(groups).sort();
    for (let k = 0; k < keys.length; k++) {
      const div = document.createElement("div");
      div.className = "group";
      const h = document.createElement("h3");
      h.textContent = keys[k];
      div.appendChild(h);
      const rows = groups[keys[k]];
      for (let i = 0; i < rows.length; i++) {
        const p = document.createElement("p");
        p.textContent = rows[i].student_name + " (" + rows[i].username + ")";
        div.appendChild(p);
        addQuizButton(div, rows[i], "Quiz from notes");
        const signed = await db.storage.from("notes")
          .createSignedUrl(rows[i].file_path, 3600);
        if (signed.data) {
          const a = document.createElement("a");
          a.href = signed.data.signedUrl;
          a.target = "_blank";
          const img = document.createElement("img");
          img.src = signed.data.signedUrl;
          a.appendChild(img);
          div.appendChild(a);
        }
      }
      box.appendChild(div);
    }
    if (keys.length === 0) {
      box.textContent = "No notes yet.";
    }
  }

  async function loadTopics() {
    const box = document.getElementById("adminList");
    box.textContent = "Loading...";
    const res = await db.from("topics").select("*")
      .order("created_at", { ascending: false });
    box.innerHTML = "";
    if (res.error) {
      box.textContent = res.error.message;
      return;
    }
    const groups = groupBy(res.data);
    const keys = Object.keys(groups).sort();
    for (let k = 0; k < keys.length; k++) {
      const div = document.createElement("div");
      div.className = "group";
      const h = document.createElement("h3");
      h.textContent = keys[k];
      div.appendChild(h);
      const rows = groups[keys[k]];
      for (let i = 0; i < rows.length; i++) {
        const p = document.createElement("p");
        p.textContent = rows[i].student_name + ": " +
          rows[i].subject + " - " + rows[i].topic;
        div.appendChild(p);
        addQuizButton(div, rows[i], rows[i].subject + ": " + rows[i].topic);
      }
      box.appendChild(div);
    }
    if (keys.length === 0) {
      box.textContent = "No topics yet.";
    }
  }
  
  let quizStudent = null;
  let quizInfo = {};

function addQuizButton(parent, row, title) {
  const b = document.createElement("button");
  b.textContent = "Create quiz";
  b.addEventListener("click", function () {
    quizStudent = row.user_id;
    quizInfo = {
      student_name: row.student_name,
      school: row.school,
      class: row.class
    };
    document.getElementById("quizFor").textContent = "Quiz for " + row.student_name;
    document.getElementById("quizTitle").value = title;
    document.getElementById("quizJson").value = "";
    document.getElementById("quizMsg").textContent = "";
    document.getElementById("quizForm").classList.remove("hidden");
    document.getElementById("quizForm").scrollIntoView();
  });
  parent.appendChild(b);
}

document.getElementById("cancelQuiz").addEventListener("click", function () {
  document.getElementById("quizForm").classList.add("hidden");
});

document.getElementById("sendQuiz").addEventListener("click", async function () {
  const msg = document.getElementById("quizMsg");
  const title = document.getElementById("quizTitle").value.trim();
  let text = document.getElementById("quizJson").value.trim();

  const start = text.indexOf("[");
  const end = text.lastIndexOf("]");
  if (title === "" || start === -1 || end === -1) {
    msg.textContent = "Add a title and paste the questions.";
    return;
  }
  text = text.slice(start, end + 1);

  let questions;
  try {
    questions = JSON.parse(text);
  } catch (e) {
    msg.textContent = "The questions are not in the right format. Ask the AI again.";
    return;
  }

  if (!Array.isArray(questions) || questions.length === 0) {
    msg.textContent = "No questions found.";
    return;
  }
  for (let i = 0; i < questions.length; i++) {
    const x = questions[i];
    if (typeof x.q !== "string" || !Array.isArray(x.options) ||
        x.options.length !== 4 || !Number.isInteger(x.answer) ||
        x.answer < 0 || x.answer > 3) {
      msg.textContent = "Question " + (i + 1) + " is not in the right format.";
      return;
    }
  }

  msg.textContent = "Sending...";
  const res = await db.from("quizzes").insert({
    student_id: quizStudent,
    student_name: quizInfo.student_name,
    school: quizInfo.school,
    class: quizInfo.class,
    title: title,
    questions: questions
  });
  
  if (res.error) {
    msg.textContent = "Could not send: " + res.error.message;
    return;
  }
  msg.textContent = "Quiz sent! (" + questions.length + " questions)";
});

document.getElementById("showResults").addEventListener("click", loadResults);

async function loadResults() {
  const box = document.getElementById("adminList");
  box.textContent = "Loading...";
  const res = await db.from("quiz_results")
    .select("score, total, created_at, student_id, quizzes(title, student_name, school, class)")
    .order("created_at", { ascending: true });
  box.innerHTML = "";
  if (res.error) {
    box.textContent = res.error.message;
    return;
  }
  if (res.data.length === 0) {
    box.textContent = "No results yet.";
    return;
  }

  const groups = {};
  for (let i = 0; i < res.data.length; i++) {
    const r = res.data[i];
    const qz = r.quizzes || {};
    const key = (qz.school || "Unknown school") + " - " + (qz.class || "");
    const name = qz.student_name || r.student_id.slice(0, 8);
    if (!groups[key]) {
      groups[key] = {};
    }
    if (!groups[key][r.student_id]) {
      groups[key][r.student_id] = { name: name, rows: [] };
    }
    groups[key][r.student_id].rows.push({
      title: qz.title || "Quiz",
      score: r.score,
      total: r.total,
      date: new Date(r.created_at).toLocaleDateString()
    });
  }

  const keys = Object.keys(groups).sort();
  for (let k = 0; k < keys.length; k++) {
    const div = document.createElement("div");
    div.className = "group";
    const h = document.createElement("h3");
    h.textContent = keys[k];
    div.appendChild(h);

    const ids = Object.keys(groups[keys[k]]);
    for (let s = 0; s < ids.length; s++) {
      const st = groups[keys[k]][ids[s]];
      let sum = 0;
      for (let i = 0; i < st.rows.length; i++) {
        sum += st.rows[i].score / st.rows[i].total * 100;
      }
      const avg = Math.round(sum / st.rows.length);

      const head = document.createElement("h4");
      head.textContent = st.name + " - average " + avg + "% (" +
        st.rows.length + " attempts)";
      div.appendChild(head);

      for (let i = 0; i < st.rows.length; i++) {
        const p = document.createElement("p");
        p.textContent = st.rows[i].date + ": " + st.rows[i].title +
          " - " + st.rows[i].score + "/" + st.rows[i].total;
        div.appendChild(p);
      }
    }
    box.appendChild(div);
  }
}

document.getElementById("showStudents").addEventListener("click", loadStudents);

let waPhone = "";
let waName = "";

function updateWaLink() {
  const note = document.getElementById("msgText").value.trim();
  const text = "Good day. This is a message from the academy about your child " +
    waName + ": " + note;
  document.getElementById("msgLink").href =
    "https://wa.me/" + waPhone + "?text=" + encodeURIComponent(text);
}

document.getElementById("msgText").addEventListener("input", updateWaLink);

document.getElementById("msgCancel").addEventListener("click", function () {
  document.getElementById("msgBox").classList.add("hidden");
});

async function loadStudents() {
  const box = document.getElementById("adminList");
  box.textContent = "Loading...";
  const res = await db.from("profiles").select("*").order("student_name");
  box.innerHTML = "";
  if (res.error) {
    box.textContent = res.error.message;
    return;
  }
  if (res.data.length === 0) {
    box.textContent = "No students yet.";
    return;
  }

  const groups = groupBy(res.data);
  const keys = Object.keys(groups).sort();
  for (let k = 0; k < keys.length; k++) {
    const div = document.createElement("div");
    div.className = "group";
    const h = document.createElement("h3");
    h.textContent = keys[k];
    div.appendChild(h);

    const rows = groups[keys[k]];
    for (let i = 0; i < rows.length; i++) {
      const s = rows[i];
      const p = document.createElement("p");
      p.textContent = s.student_name + " (" + s.username + ") ";

      const b = document.createElement("button");
      b.textContent = "💬";
      b.addEventListener("click", function () {
        document.getElementById("msgFor").textContent =
          "Message to the parent of " + s.student_name;
        document.getElementById("msgText").value = "";
        waPhone = s.parent_phone;
        waName = s.student_name;
        updateWaLink();
        document.getElementById("msgBox").classList.remove("hidden");
        document.getElementById("msgBox").scrollIntoView();
      });
      p.appendChild(b);
      div.appendChild(p);
    }
    box.appendChild(div);
  }
} 

  async function checkAdminSession() {
    const s = await db.auth.getSession();
    if (s.data.session) {
      startAdmin();
    }
  }
  checkAdminSession();
</script>
</body>
</html>
