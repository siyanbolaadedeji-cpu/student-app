<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="style.css?v=9">
  <style>
    .group { text-align: left; margin: 10px; padding: 10px;
             background: white; border-radius: 10px; }
    .group img { width: 90px; margin: 4px; border-radius: 6px; }
    textarea { width: 90%; padding: 10px; font-size: 16px; border-radius: 8px; }

    .waBtn { display: inline-block; background: #0a7d2e; color: white;
             padding: 10px 20px; border-radius: 8px; text-decoration: none;

      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 12px;

    #adminMenu button { width: 100%; margin: 0; }
    #showJamb, #adminLogout { grid-column: 1 / -1; }
    #backMenu { margin: 10px; }

let schoolAlias = {};
let schoolGroups = [];

function schoolKey(s) {
  return String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
}

function normSchool(s) {
  const key = schoolKey(s);
  if (schoolAlias[key]) {
    return schoolAlias[key];
  }
  return key.replace(/\b\w/g, function (c) {
    return c.toUpperCase();
  });
}

function schoolLabel(k) {
  if (!k) {
    return "All schools";
  }
  if (k.indexOf("g:") === 0) {
    const want = k.slice(2);
    for (let i = 0; i < schoolGroups.length; i++) {
      if (schoolGroups[i].toLowerCase() === want) {
        return "Group " + schoolGroups[i];
      }
    }
    return "Group " + want;
  }
  if (k.indexOf("s:") === 0) {
    return normSchool(k.slice(2));
  }
  return normSchool(k);
}

async function loadSchoolMap() {
  const g = await db.from("school_groups").select("name").order("name");
  const a = await db.from("school_alias").select("alias_key, group_name");
  schoolGroups = g.data ? g.data.map(function (x) {
    return x.name;
  }) : [];
  schoolAlias = {};
  if (a.data) {
    for (let i = 0; i < a.data.length; i++) {
      schoolAlias[a.data[i].alias_key] = a.data[i].group_name;
    }
  }
}
  function groupBy(rows) {
    const out = {};
    for (let i = 0; i < rows.length; i++) {
      const key = normSchool(rows[i].school) + " - " + rows[i].class;
      if (!out[key]) {
        out[key] = [];
      }
      out[key].push(rows[i]);
    }
    return out;
  }

  function addQuizButton(parent, row, title) {
    const b = document.createElement("button");
    b.textContent = "Create quiz";
    b.addEventListener("click", function () {
      quizStudent = row.user_id;
      quizInfo = {
        student_name: row.student_name,
        school: row.school,
        class: row.class
      };
      document.getElementById("quizFor").textContent = "Quiz for " + row.student_name;
      document.getElementById("quizTitle").value = title;
      document.getElementById("quizJson").value = "";
      document.getElementById("quizMsg").textContent = "";
      document.getElementById("quizForm").classList.remove("hidden");
      document.getElementById("quizForm").scrollIntoView();

  }

  document.getElementById("cancelQuiz").addEventListener("click", function () {

  document.getElementById("sendQuiz").addEventListener("click", async function () {
    const msg = document.getElementById("quizMsg");
    const title = document.getElementById("quizTitle").value.trim();
    let text = document.getElementById("quizJson").value.trim();

    const start = text.indexOf("[");
    const end = text.lastIndexOf("]");
    if (title === "" || start === -1 || end === -1) {
      msg.textContent = "Add a title and paste the questions.";
      return;
    }
    text = text.slice(start, end + 1);

    let questions;
    try {
      questions = JSON.parse(text);
    } catch (e) {
      msg.textContent = "The questions are not in the right format. Ask the AI again.";
      return;
    }

    if (!Array.isArray(questions) || questions.length === 0) {
      msg.textContent = "No questions found.";
      return;
    }
    for (let i = 0; i < questions.length; i++) {
      const x = questions[i];
      if (typeof x.q !== "string" || !Array.isArray(x.options) ||
          x.options.length !== 4 || !Number.isInteger(x.answer) ||
          x.answer < 0 || x.answer > 3) {
        msg.textContent = "Question " + (i + 1) + " is not in the right format.";
        return;
      }
    }
   const bad = quizDia.apply(questions);
    if (bad) {
      msg.textContent = bad;
      return;
    }
    msg.textContent = "Sending...";
    const res = await db.from("quizzes").insert({
      student_id: quizStudent,
      student_name: quizInfo.student_name,
      school: quizInfo.school,
      class: quizInfo.class,
      title: title,
      questions: questions
    });
    if (res.error) {
      msg.textContent = "Could not send: " + res.error.message;
      return;
    }
    msg.textContent = "Quiz sent! (" + questions.length + " questions)";
    quizDia.reset();
  });
  
  async function loadNotes() {
  const box = document.getElementById("adminList");
  box.textContent = "Loading...";
  const res = await db.from("notes").select("*")
    .order("created_at", { ascending: false });
  box.innerHTML = "";
  if (res.error) {
    box.textContent = res.error.message;
    return;
  }
  if (res.data.length === 0) {
    box.textContent = "No uploads yet.";
    return;
  }

  const groups = groupBy(res.data);
  const keys = Object.keys(groups).sort();
  for (let k = 0; k < keys.length; k++) {
    const rows = groups[keys[k]];
    const students = {};
    for (let i = 0; i < rows.length; i++) {
      const id = rows[i].user_id;
      if (!students[id]) {
        students[id] = [];
      }
      students[id].push(rows[i]);
    }
    const ids = Object.keys(students);

    const classBox = document.createElement("details");
    classBox.className = "group";
    const classHead = document.createElement("summary");
    classHead.textContent = keys[k] + " (" + ids.length + " students, " +
      rows.length + " uploads)";
    classBox.appendChild(classHead);

    for (let s = 0; s < ids.length; s++) {
      const list = students[ids[s]];
      const stBox = document.createElement("details");
      stBox.className = "student item";
      stBox.dataset.name = (list[0].student_name + " " + list[0].username).toLowerCase();
      const stHead = document.createElement("summary");
      stHead.textContent = list[0].student_name + " (" + list[0].username +
        ") - " + list.length + " uploads";
      stBox.appendChild(stHead);

      let loaded = false;
      stBox.addEventListener("toggle", async function () {
        if (!stBox.open || loaded) {
          return;
        }
        loaded = true;
        for (let i = 0; i < list.length; i++) {
          const row = list[i];
          const wrap = document.createElement("div");

          const p = document.createElement("p");
          p.textContent = new Date(row.created_at).toLocaleDateString() +
            " - " + (row.kind || "Notes") +
            (row.description ? ": " + row.description : "");
          wrap.appendChild(p);
          addQuizButton(wrap, row, "Quiz from notes");

          const del = document.createElement("button");
          del.className = "delBtn";
          del.textContent = "Delete";
          del.addEventListener("click", async function () {
            if (!confirm("Delete this upload permanently?")) {
              return;
            }
            const r1 = await db.storage.from("notes").remove([row.file_path]);
            if (r1.error || !r1.data || r1.data.length === 0) {
              alert("The photo could not be deleted.");
              return;
            }
            const r2 = await db.from("notes").delete().eq("id", row.id).select();
            if (r2.error || !r2.data || r2.data.length === 0) {
              alert("The record could not be deleted.");
              return;
            }
            wrap.remove();
          });
          wrap.appendChild(del);

          const signed = await db.storage.from("notes")
            .createSignedUrl(row.file_path, 3600);
          if (signed.data) {
            const a = document.createElement("a");
            a.href = signed.data.signedUrl;
            a.target = "_blank";
            const img = document.createElement("img");
            img.src = signed.data.signedUrl;
            a.appendChild(img);
            wrap.appendChild(a);
          }
          stBox.appendChild(wrap);
        }
      });
      classBox.appendChild(stBox);
    }
    box.appendChild(classBox);
  }
}

  async function loadResults() {
  const box = document.getElementById("adminList");
  box.textContent = "Loading...";
  const res = await db.from("quiz_results")
    .select("quiz_id, score, total, created_at, student_id, quizzes(title, student_name, school, class)")
    .order("created_at", { ascending: false });
  box.innerHTML = "";
  if (res.error) {
    box.textContent = res.error.message;
    return;
  }
  if (res.data.length === 0) {
    box.textContent = "No results yet.";
    return;
  }

  const groups = {};
  for (let i = 0; i < res.data.length; i++) {
    const r = res.data[i];
    const qz = r.quizzes || {};
    const key = normSchool(qz.school || "Unknown school") + " - " + (qz.class || "");
    const name = qz.student_name || r.student_id.slice(0, 8);
    if (!groups[key]) {
      groups[key] = {};
    }
    if (!groups[key][r.student_id]) {
      groups[key][r.student_id] = { name: name, rows: [] };
    }
    groups[key][r.student_id].rows.push({
      quizId: r.quiz_id,
      title: qz.title || "Quiz",
      score: r.score,
      total: r.total,
      date: new Date(r.created_at).toLocaleDateString()
    });
  }

  const keys = Object.keys(groups).sort();
  for (let k = 0; k < keys.length; k++) {
    const ids = Object.keys(groups[keys[k]]);
    const classBox = document.createElement("details");
    classBox.className = "group";
    const classHead = document.createElement("summary");
    classHead.textContent = keys[k] + " (" + ids.length + " students)";
    classBox.appendChild(classHead);

    for (let s = 0; s < ids.length; s++) {
      const st = groups[keys[k]][ids[s]];
      const best = {};
      for (let i = 0; i < st.rows.length; i++) {
        const pct = st.rows[i].score / st.rows[i].total * 100;
        const q = st.rows[i].quizId;
        if (best[q] === undefined || pct > best[q]) {
          best[q] = pct;
        }
      }
      const quizIds = Object.keys(best);
      let sum = 0;
      for (let i = 0; i < quizIds.length; i++) {
        sum += best[quizIds[i]];
      }
      const avg = Math.round(sum / quizIds.length);

      const stBox = document.createElement("details");
      stBox.className = "student item";
      stBox.dataset.name = st.name.toLowerCase();
      const stHead = document.createElement("summary");
      stHead.textContent = st.name + " - average " + avg + "% (" +
        quizIds.length + " quizzes, " + st.rows.length + " attempts)";
      stBox.appendChild(stHead);

      for (let i = 0; i < st.rows.length; i++) {
        const p = document.createElement("p");
        p.textContent = st.rows[i].date + ": " + st.rows[i].title +
          " - " + st.rows[i].score + "/" + st.rows[i].total;
        stBox.appendChild(p);
      }
      classBox.appendChild(stBox);
    }
    box.appendChild(classBox);
  }
}

function filterList() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const groups = document.querySelectorAll("#adminList .group");
  for (let g = 0; g < groups.length; g++) {
    const items = groups[g].querySelectorAll(".item");
    if (items.length === 0) {
      continue;
    }
    let shown = 0;
    for (let i = 0; i < items.length; i++) {
      const match = q === "" || items[i].dataset.name.includes(q);
      items[i].classList.toggle("hidden", !match);
      if (match) {

    groups[g].classList.toggle("hidden", shown === 0);
    if (groups[g].tagName === "DETAILS" && q !== "" && shown > 0) {
      groups[g].open = true;
    }
  }
}

function randomPin() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const bytes = new Uint8Array(10);
  crypto.getRandomValues(bytes);
  let out = "";
  for (let i = 0; i < bytes.length; i++) {
    out += chars[bytes[i] % chars.length];
  }
  return out;
}

function parseQuestions(raw) {
  const start = raw.indexOf("[");
  const end = raw.lastIndexOf("]");
  if (start === -1 || end === -1) {
    return { error: "Paste the questions first." };
  }
  let questions;
  try {
    questions = JSON.parse(raw.slice(start, end + 1));
  } catch (e) {
    return { error: "The questions are not in the right format. Ask the AI again." };
  }
  if (!Array.isArray(questions) || questions.length === 0) {
    return { error: "No questions found." };
  }
  for (let i = 0; i < questions.length; i++) {
    const x = questions[i];
    if (typeof x.q !== "string" || !Array.isArray(x.options) ||
        x.options.length !== 4 || !Number.isInteger(x.answer) ||
        x.answer < 0 || x.answer > 3) {
      return { error: "Question " + (i + 1) + " is not in the right format." };
    }
  }
  return { questions: questions };
}

  for (let i = 0; i < res.data.length; i++) {
    const r = res.data[i];
    const who = info[r.student_id] || { name: r.student_id.slice(0, 8), key: "Unknown" };
    const st = r.english_sets || {};
    if (!groups[who.key]) {
      groups[who.key] = {};
    }
    if (!groups[who.key][r.student_id]) {
      groups[who.key][r.student_id] = { name: who.name, rows: [] };
    }
    groups[who.key][r.student_id].rows.push({
      setId: r.set_id,
      title: st.title || "English",
      score: r.score,
      total: r.total,
      date: new Date(r.created_at).toLocaleDateString()
    });
  }

  const keys = Object.keys(groups).sort();
  for (let k = 0; k < keys.length; k++) {
    const ids = Object.keys(groups[keys[k]]);
    const classBox = document.createElement("details");
    classBox.className = "group";
    const classHead = document.createElement("summary");
    classHead.textContent = keys[k] + " (" + ids.length + " students)";
    classBox.appendChild(classHead);

    for (let s = 0; s < ids.length; s++) {
      const st = groups[keys[k]][ids[s]];
      const best = {};
      for (let i = 0; i < st.rows.length; i++) {
        const pct = st.rows[i].score / st.rows[i].total * 100;
        const q = st.rows[i].setId;
        if (best[q] === undefined || pct > best[q]) {
          best[q] = pct;
        }
      }
      const setIds = Object.keys(best);
      let sum = 0;
      for (let i = 0; i < setIds.length; i++) {
        sum += best[setIds[i]];
      }

      const stBox = document.createElement("details");
      stBox.className = "student item";
      stBox.dataset.name = st.name.toLowerCase();
      const stHead = document.createElement("summary");
      stHead.textContent = st.name + " - average " +
        Math.round(sum / setIds.length) + "% (" + setIds.length + " sets, " +
        st.rows.length + " attempts)";
      stBox.appendChild(stHead);

      for (let i = 0; i < st.rows.length; i++) {
        const p = document.createElement("p");
        p.textContent = st.rows[i].date + ": " + st.rows[i].title +
          " - " + st.rows[i].score + "/" + st.rows[i].total;
        stBox.appendChild(p);
      }
      classBox.appendChild(stBox);
    }
    box.appendChild(classBox);
  }
}
function shrinkDiagram(file) {
  return new Promise(function (resolve) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      const max = 1400;
      let w = img.width;
      let h = img.height;
      if (w > max || h > max) {
        const scale = max / Math.max(w, h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function (blob) {
        URL.revokeObjectURL(url);
        resolve(blob);
      }, "image/jpeg", 0.85);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      resolve(null);
    };
    img.src = url;
  });
}

function makeDiagramTool(box) {
  const picks = {};

  const title = document.createElement("p");
  title.textContent = "Diagrams (optional)";
  const num = document.createElement("input");
  num.type = "number";
  num.min = "1";
  num.placeholder = "Question no.";
  const file = document.createElement("input");
  file.type = "file";
  file.accept = "image/*";
  const attach = document.createElement("button");
  attach.textContent = "Attach diagram";
  const msg = document.createElement("p");
  const list = document.createElement("div");

  box.appendChild(title);
  box.appendChild(num);
  box.appendChild(document.createElement("br"));
  box.appendChild(document.createElement("br"));
  box.appendChild(file);
  box.appendChild(document.createElement("br"));
  box.appendChild(document.createElement("br"));
  box.appendChild(attach);
  box.appendChild(msg);
  box.appendChild(list);

  function show() {
    list.innerHTML = "";
    const nums = Object.keys(picks).sort(function (a, b) {
      return a - b;
    });
    for (let i = 0; i < nums.length; i++) {
      const n = nums[i];
      const p = document.createElement("p");
      p.textContent = "Question " + n + ": diagram attached ";
      const del = document.createElement("button");
      del.className = "delBtn";
      del.textContent = "Remove";
      del.addEventListener("click", async function () {
        await db.storage.from("diagrams").remove([picks[n]]);
        delete picks[n];
        show();
      });
      p.appendChild(del);
      list.appendChild(p);
    }
  }

  attach.addEventListener("click", async function () {
    const n = Number(num.value);
    if (!Number.isInteger(n) || n < 1) {
      msg.textContent = "Type the question number first.";
      return;
    }
    if (!file.files[0]) {
      msg.textContent = "Choose an image first.";
      return;
    }
    msg.textContent = "Uploading...";
    const blob = await shrinkDiagram(file.files[0]);
    if (!blob) {
      msg.textContent = "Could not read that image.";
      return;
    }
    const path = "q/" + Date.now() + "_" + n + ".jpg";
    const up = await db.storage.from("diagrams")
      .upload(path, blob, { contentType: "image/jpeg" });
    if (up.error) {
      msg.textContent = "Upload failed: " + up.error.message;
      return;
    }
    if (picks[n]) {
      await db.storage.from("diagrams").remove([picks[n]]);
    }
    picks[n] = path;
    msg.textContent = "Attached to question " + n + ".";
    num.value = "";
    file.value = "";
    show();
  });

  return {
    apply: function (questions) {
      for (const n in picks) {
        if (Number(n) > questions.length) {
          return "You attached a diagram to question " + n +
            ", but there are only " + questions.length + " questions.";
        }
      }
      for (const n in picks) {
        questions[Number(n) - 1].img = picks[n];
      }
      return null;
    },
    reset: function () {
      for (const n in picks) {
        delete picks[n];
      }
      show();
      msg.textContent = "";
    }
  };
}

const BASE_TITLE = "ACE Academy Admin";

const badgeSources = {
  showNotes: { table: "notes", key: "notes" },
  showTopics: { table: "topics", key: "topics" },
  showResults: { table: "quiz_results", key: "results" },

function getSeen(k) {
  const name = "adminSeen_" + k;
  try {
    let v = localStorage.getItem(name);
    if (!v) {
      v = new Date().toISOString();
      localStorage.setItem(name, v);
    }
    return v;
  } catch (e) {
    return new Date().toISOString();
  }
}

function markSeen(k) {
  try {
    localStorage.setItem("adminSeen_" + k, new Date().toISOString());
  } catch (e) {}
}

function setBadge(btnId, n) {
  const btn = document.getElementById(btnId);
  let b = btn.querySelector(".badge");
  if (!b) {
    b = document.createElement("span");
    b.className = "badge";
    btn.appendChild(b);
  }
  b.textContent = n > 99 ? "99+" : String(n);
  b.classList.toggle("hidden", n === 0);
}

async function refreshBadges() {
  if (document.getElementById("adminHome").classList.contains("hidden") ||
      document.getElementById("adminMenu").classList.contains("hidden")) {
    return;
  }
  let total = 0;
  const ids = Object.keys(badgeSources);
  for (let i = 0; i < ids.length; i++) {
    const s = badgeSources[ids[i]];
    const res = await db.from(s.table)
      .select("*", { count: "exact", head: true })
      .gt("created_at", getSeen(s.key));
    const n = res.error ? 0 : (res.count || 0);
    setBadge(ids[i], n);
    total += n;
  }

  const pend = await db.from("jamb_requests")
    .select("*", { count: "exact", head: true })
    .eq("status", "pending");
  const jr = await db.from("jamb_results")
    .select("*", { count: "exact", head: true })
    .gt("created_at", getSeen("jamb"));
  const jn = (pend.error ? 0 : (pend.count || 0)) + (jr.error ? 0 : (jr.count || 0));
  setBadge("showJamb", jn);
  total += jn;

  document.title = total > 0 ? "(" + total + ") " + BASE_TITLE : BASE_TITLE;
}

const badgeIds = Object.keys(badgeSources).concat(["showJamb"]);
for (let i = 0; i < badgeIds.length; i++) {
  document.getElementById(badgeIds[i]).addEventListener("click", function () {
    const key = badgeIds[i] === "showJamb" ? "jamb" : badgeSources[badgeIds[i]].key;
    markSeen(key);
    if (badgeIds[i] !== "showJamb") {
      setBadge(badgeIds[i], 0);
    }
  });
}

setInterval(refreshBadges, 20000);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") {
    refreshBadges();
  }
});

async function loadSchools() {
  const box = document.getElementById("adminList");
  box.textContent = "Loading...";
  await loadSchoolMap();
  const prof = await db.from("profiles").select("school");
  box.innerHTML = "";
  if (prof.error) {
    box.textContent = prof.error.message;
    return;
  }

  const typed = {};
  for (let i = 0; i < prof.data.length; i++) {
    const raw = String(prof.data[i].school || "").trim().replace(/\s+/g, " ");
    const k = schoolKey(raw);
    if (!k) {
      continue;
    }
    if (!typed[k]) {
      typed[k] = { shown: raw, count: 0 };
    }
    typed[k].count++;
  }
  const keys = Object.keys(typed);

  const members = {};
  for (let i = 0; i < keys.length; i++) {
    const g = schoolAlias[keys[i]];
    if (g) {
      members[g] = (members[g] || 0) + typed[keys[i]].count;
    }
  }

  const gBox = document.createElement("div");
  gBox.className = "group";
  const gh = document.createElement("h3");
  gh.textContent = "School groups (" + schoolGroups.length + ")";
  gBox.appendChild(gh);

  const gi = document.createElement("input");
  gi.placeholder = "New group name, e.g. A";
  gBox.appendChild(gi);
  const gb = document.createElement("button");
  gb.textContent = "Add group";
  gb.addEventListener("click", async function () {
    const name = gi.value.trim();
    if (name === "") {
      return;
    }
    const clash = schoolGroups.some(function (g) {
      return g.toLowerCase() === name.toLowerCase();
    });
    if (clash) {
      alert("That group already exists.");
      return;
    }
    const r = await db.from("school_groups").insert({ name: name });
    if (r.error) {
      alert("Could not add: " + r.error.message);
      return;
    }
    loadSchools();
  });
  gBox.appendChild(gb);

  for (let i = 0; i < schoolGroups.length; i++) {
    const name = schoolGroups[i];
    const p = document.createElement("p");
    p.textContent = name + " - " + (members[name] || 0) + " students ";
    const del = document.createElement("button");
    del.className = "delBtn";
    del.textContent = "Delete";
    del.addEventListener("click", async function () {
      if (!confirm('Delete group "' + name + '"? Its schools become ungrouped.')) {
        return;
      }
      const r = await db.from("school_groups").delete().eq("name", name);
      if (r.error) {
        alert("Could not delete: " + r.error.message);
        return;
      }
      loadSchools();
    });
    p.appendChild(del);
    gBox.appendChild(p);
  }
  box.appendChild(gBox);

  const tBox = document.createElement("div");
  tBox.className = "group";
  const th = document.createElement("h3");
  th.textContent = "Names students typed (" + keys.length + ")";
  tBox.appendChild(th);

  keys.sort(function (a, b) {
    const ua = schoolAlias[a] ? 1 : 0;
    const ub = schoolAlias[b] ? 1 : 0;
    if (ua !== ub) {
      return ua - ub;
    }
    return a < b ? -1 : 1;
  });

  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    const p = document.createElement("p");
    const label = document.createElement("span");
    function paint() {
      label.textContent = (schoolAlias[k] ? "" : "⚠ ") + typed[k].shown +
        " (" + typed[k].count + ") ";
    }
    paint();
    p.appendChild(label);

    const sel = document.createElement("select");
    const none = document.createElement("option");
    none.value = "";
    none.textContent = "Not grouped";
    sel.appendChild(none);
    for (let j = 0; j < schoolGroups.length; j++) {
      const o = document.createElement("option");
      o.value = schoolGroups[j];
      o.textContent = schoolGroups[j];
      sel.appendChild(o);
    }
    sel.value = schoolAlias[k] || "";
    sel.addEventListener("change", async function () {
      let r;
      if (sel.value === "") {
        r = await db.from("school_alias").delete().eq("alias_key", k);
      } else {
        r = await db.from("school_alias").upsert(
          { alias_key: k, group_name: sel.value }, { onConflict: "alias_key" });
      }
      if (r.error) {
        alert("Could not save: " + r.error.message);
        sel.value = schoolAlias[k] || "";
        return;
      }
      if (sel.value === "") {
        delete schoolAlias[k];
      } else {
        schoolAlias[k] = sel.value;
      }
      paint();
    });
    p.appendChild(sel);
    tBox.appendChild(p);
  }
  box.appendChild(tBox);
}
