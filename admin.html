<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE Academy Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .group { text-align: left; margin: 10px; padding: 10px;
             background: white; border-radius: 10px; }
    .group img { width: 90px; margin: 4px; border-radius: 6px; }
    textarea { width: 90%; padding: 10px; font-size: 16px; border-radius: 8px; }
    #adminHome button { margin: 5px; }
    .waBtn { display: inline-block; background: #0a7d2e; color: white;
             padding: 10px 20px; border-radius: 8px; text-decoration: none;
             font-size: 18px; margin: 5px; }
             summary { cursor: pointer; font-weight: bold; padding: 8px 0; }
    .student { margin-left: 8px; border-top: 1px solid #ddd; }
    .pinOut { font-size: 22px; font-weight: bold; word-break: break-all; margin: 8px 0; }
  </style>
</head>
<body>

<div id="adminLogin" class="screen">
  <h1>Admin Login</h1>
  <input id="adminEmail" type="email" placeholder="Admin email">
  <br><br>
  <input id="adminPass" type="password" placeholder="Password">
  <br><br>
  <button id="adminLoginBtn">Log in</button>
  <p id="adminMsg"></p>
</div>

<div id="adminHome" class="screen hidden">
  <h1>ACE Academy Admin</h1>
  <button id="adminLogout">Log out</button>
  <br><br>
  <button id="showNotes">Uploads</button>
  <button id="showTopics">SS Topics</button>
  <button id="showResults">Results</button>
  <button id="showStudents">Students</button>
  <button id="showJamb">JAMB</button>

  <div id="quizForm" class="group hidden">
    <h3 id="quizFor"></h3>
    <input id="quizTitle" placeholder="Quiz title">
    <br><br>
    <textarea id="quizJson" rows="8" placeholder="Paste the AI's questions here"></textarea>
    <br><br>
    <button id="sendQuiz">Send quiz</button>
    <button id="cancelQuiz">Cancel</button>
    <p id="quizMsg"></p>
  </div>

  <div id="msgBox" class="group hidden">
    <h3 id="msgFor"></h3>
    <textarea id="msgText" rows="4" placeholder="Type your message about the child"></textarea>
    <br><br>
    <a id="msgLink" class="waBtn" href="#" target="_blank">Open WhatsApp</a>
    <button id="msgCancel">Cancel</button>
  </div>
<input id="searchBox" class="hidden" placeholder="Search student name">
  <br><br>
  <div id="jambPanel" class="group hidden">
    <h3>Make a JAMB PIN</h3>
    <select id="pinDept">
      <option>Science</option>
      <option>Art</option>
      <option>Commercial</option>
    </select>
    <select id="pinDays">
      <option value="120">120 days</option>
      <option value="30">30 days</option>
      <option value="60">60 days</option>
      <option value="90">90 days</option>
    </select>
    <br><br>
    <input id="pinNote" placeholder="Student name / payment note">
    <br><br>
    <button id="makePin">Make PIN</button>
    <div id="pinOut" class="pinOut"></div>
    <hr>
    <h3>Send a JAMB quiz</h3>
    <select id="jqDept">
      <option>Science</option>
      <option>Art</option>
      <option>Commercial</option>
    </select>
    <br><br>
    <input id="jqTitle" placeholder="Quiz title">
    <br><br>
    <textarea id="jqJson" rows="8" placeholder="Paste the AI's questions here"></textarea>
    <br><br>
    <button id="sendJq">Send to department</button>
    <p id="jqMsg"></p>
  </div>
  <div id="adminList"></div>
</div>

  async function startAdmin() {
    const ok = await db.rpc("is_admin");
    if (ok.error || ok.data !== true) {
      await db.auth.signOut();
      showAdmin(false);
      document.getElementById("adminMsg").innerText =
        "This account is not an admin.";

  function groupBy(rows) {
    const out = {};
    for (let i = 0; i < rows.length; i++) {
      const key = rows[i].school + " - " + rows[i].class;
      if (!out[key]) {
        out[key] = [];
      }
      out[key].push(rows[i]);
    }
    return out;
  }

  function addQuizButton(parent, row, title) {
    const b = document.createElement("button");
    b.textContent = "Create quiz";
    b.addEventListener("click", function () {
      quizStudent = row.user_id;
      quizInfo = {
        student_name: row.student_name,
        school: row.school,
        class: row.class
      };
      document.getElementById("quizFor").textContent = "Quiz for " + row.student_name;
      document.getElementById("quizTitle").value = title;
      document.getElementById("quizJson").value = "";
      document.getElementById("quizMsg").textContent = "";
      document.getElementById("quizForm").classList.remove("hidden");
      document.getElementById("quizForm").scrollIntoView();

    parent.appendChild(b);
  }

  document.getElementById("sendQuiz").addEventListener("click", async function () {
    const msg = document.getElementById("quizMsg");
    const title = document.getElementById("quizTitle").value.trim();
    let text = document.getElementById("quizJson").value.trim();

    const start = text.indexOf("[");
    const end = text.lastIndexOf("]");
    if (title === "" || start === -1 || end === -1) {
      msg.textContent = "Add a title and paste the questions.";
      return;
    }
    text = text.slice(start, end + 1);

    let questions;
    try {
      questions = JSON.parse(text);
    } catch (e) {
      msg.textContent = "The questions are not in the right format. Ask the AI again.";
      return;
    }

    if (!Array.isArray(questions) || questions.length === 0) {
      msg.textContent = "No questions found.";
      return;
    }
    for (let i = 0; i < questions.length; i++) {
      const x = questions[i];
      if (typeof x.q !== "string" || !Array.isArray(x.options) ||
          x.options.length !== 4 || !Number.isInteger(x.answer) ||
          x.answer < 0 || x.answer > 3) {
        msg.textContent = "Question " + (i + 1) + " is not in the right format.";
        return;
      }
    }

    msg.textContent = "Sending...";
    const res = await db.from("quizzes").insert({
      student_id: quizStudent,
      student_name: quizInfo.student_name,
      school: quizInfo.school,
      class: quizInfo.class,
      title: title,
      questions: questions
    });
    if (res.error) {
      msg.textContent = "Could not send: " + res.error.message;
      return;
    }
    msg.textContent = "Quiz sent! (" + questions.length + " questions)";
  });

  async function loadNotes() {
  const box = document.getElementById("adminList");
  box.textContent = "Loading...";
  const res = await db.from("notes").select("*")
    .order("created_at", { ascending: false });
  box.innerHTML = "";
  if (res.error) {
    box.textContent = res.error.message;
    return;
  }
  if (res.data.length === 0) {
    box.textContent = "No uploads yet.";
    return;
  }

  const groups = groupBy(res.data);
  const keys = Object.keys(groups).sort();
  for (let k = 0; k < keys.length; k++) {
    const rows = groups[keys[k]];
    const students = {};
    for (let i = 0; i < rows.length; i++) {
      const id = rows[i].user_id;
      if (!students[id]) {
        students[id] = [];
      }
      students[id].push(rows[i]);
    }
    const ids = Object.keys(students);

    const classBox = document.createElement("details");
    classBox.className = "group";
    const classHead = document.createElement("summary");
    classHead.textContent = keys[k] + " (" + ids.length + " students, " +
      rows.length + " uploads)";
    classBox.appendChild(classHead);

    for (let s = 0; s < ids.length; s++) {
      const list = students[ids[s]];
      const stBox = document.createElement("details");
      stBox.className = "student item";
      stBox.dataset.name = (list[0].student_name + " " + list[0].username).toLowerCase();
      const stHead = document.createElement("summary");
      stHead.textContent = list[0].student_name + " (" + list[0].username +
        ") - " + list.length + " uploads";
      stBox.appendChild(stHead);

      let loaded = false;
      stBox.addEventListener("toggle", async function () {
        if (!stBox.open || loaded) {
          return;
        }
        loaded = true;
        for (let i = 0; i < list.length; i++) {
          const row = list[i];
          const wrap = document.createElement("div");

          const p = document.createElement("p");
          p.textContent = new Date(row.created_at).toLocaleDateString() +
            " - " + (row.kind || "Notes") +
            (row.description ? ": " + row.description : "");
          wrap.appendChild(p);
          addQuizButton(wrap, row, "Quiz from notes");

          const del = document.createElement("button");
          del.className = "delBtn";
          del.textContent = "Delete";
          del.addEventListener("click", async function () {
            if (!confirm("Delete this upload permanently?")) {
              return;
            }
            const r1 = await db.storage.from("notes").remove([row.file_path]);
            if (r1.error || !r1.data || r1.data.length === 0) {
              alert("The photo could not be deleted.");
              return;
            }
            const r2 = await db.from("notes").delete().eq("id", row.id).select();
            if (r2.error || !r2.data || r2.data.length === 0) {
              alert("The record could not be deleted.");
              return;
            }
            wrap.remove();
          });
          wrap.appendChild(del);

          const signed = await db.storage.from("notes")
            .createSignedUrl(row.file_path, 3600);
          if (signed.data) {
            const a = document.createElement("a");
            a.href = signed.data.signedUrl;
            a.target = "_blank";
            const img = document.createElement("img");
            img.src = signed.data.signedUrl;
            a.appendChild(img);
            wrap.appendChild(a);
          }
          stBox.appendChild(wrap);
        }
      });
      classBox.appendChild(stBox);
    }
    box.appendChild(classBox);
  }
}

  async function loadResults() {

    if (res.data.length === 0) {

    }

    const groups = {};
    for (let i = 0; i < res.data.length; i++) {
      const r = res.data[i];
      const qz = r.quizzes || {};
      const key = (qz.school || "Unknown school") + " - " + (qz.class || "");
      const name = qz.student_name || r.student_id.slice(0, 8);
      if (!groups[key]) {

      if (!groups[key][r.student_id]) {
        groups[key][r.student_id] = { name: name, rows: [] };
      }
      groups[key][r.student_id].rows.push({
        title: qz.title || "Quiz",
        score: r.score,

        date: new Date(r.created_at).toLocaleDateString()
      });

    const keys = Object.keys(groups).sort();
    for (let k = 0; k < keys.length; k++) {
      const div = document.createElement("div");

      const h = document.createElement("h3");
      h.textContent = keys[k];
      div.appendChild(h);

      const ids = Object.keys(groups[keys[k]]);

        let sum = 0;
        for (let i = 0; i < st.rows.length; i++) {

function filterList() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const groups = document.querySelectorAll("#adminList .group");
  for (let g = 0; g < groups.length; g++) {
    const items = groups[g].querySelectorAll(".item");
    if (items.length === 0) {
      continue;
    }
    let shown = 0;
    for (let i = 0; i < items.length; i++) {
      const match = q === "" || items[i].dataset.name.includes(q);
      items[i].classList.toggle("hidden", !match);
      if (match) {
        shown++;
      }
    }
    groups[g].classList.toggle("hidden", shown === 0);
    if (groups[g].tagName === "DETAILS" && q !== "" && shown > 0) {
      groups[g].open = true;
    }
  }
}

function randomPin() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const bytes = new Uint8Array(10);
  crypto.getRandomValues(bytes);
  let out = "";
  for (let i = 0; i < bytes.length; i++) {
    out += chars[bytes[i] % chars.length];
  }
  return out;
}

function parseQuestions(raw) {
  const start = raw.indexOf("[");
  const end = raw.lastIndexOf("]");
  if (start === -1 || end === -1) {
    return { error: "Paste the questions first." };
  }
  let questions;
  try {
    questions = JSON.parse(raw.slice(start, end + 1));
  } catch (e) {
    return { error: "The questions are not in the right format. Ask the AI again." };
  }
  if (!Array.isArray(questions) || questions.length === 0) {
    return { error: "No questions found." };
  }
  for (let i = 0; i < questions.length; i++) {
    const x = questions[i];
    if (typeof x.q !== "string" || !Array.isArray(x.options) ||
        x.options.length !== 4 || !Number.isInteger(x.answer) ||
        x.answer < 0 || x.answer > 3) {
      return { error: "Question " + (i + 1) + " is not in the right format." };
    }
  }
  return { questions: questions };
}

document.getElementById("sendJq").addEventListener("click", async function () {
  const msg = document.getElementById("jqMsg");
  const title = document.getElementById("jqTitle").value.trim();

    msg.textContent = "Add a quiz title.";
    return;
  }
  if (parsed.error) {
    msg.textContent = parsed.error;
    return;
  }

  msg.textContent = "Sending...";
  const res = await db.from("jamb_quizzes").insert({
    department: dept,
    title: title,
    questions: parsed.questions
  });
  if (res.error) {
    msg.textContent = "Could not send: " + res.error.message;
    return;
  }
  msg.textContent = "Sent to " + dept + "! (" + parsed.questions.length + " questions)";
  document.getElementById("jqJson").value = "";
});

  const prof = await db.from("profiles").select("user_id, student_name, username");
  const pins = await db.from("jamb_pins")
    .select("id, pin, department, days, note")
    .is("used_by", null)
    .order("created_at", { ascending: false });

  box.innerHTML = "";
  const failed = reqs.error || acc.error || pins.error;
  if (failed) {
    box.textContent = failed.message;
    return;
  }

  const names = {};
  for (let i = 0; i < reqs.data.length; i++) {
    if (reqs.data[i].username) {
      names[reqs.data[i].user_id] = reqs.data[i].username;
    }
  }
  if (prof.data) {
    for (let i = 0; i < prof.data.length; i++) {
      names[prof.data[i].user_id] =
        prof.data[i].student_name + " (" + prof.data[i].username + ")";
    }
  }
  function who(id) {
    return names[id] || id.slice(0, 8);
  }

  const pending = reqs.data.filter(function (r) {
    return r.status === "pending";
  });

  const pBox = document.createElement("div");
  pBox.className = "group";
  const ph = document.createElement("h3");
  ph.textContent = "Pending JAMB payments (" + pending.length + ")";
  pBox.appendChild(ph);
  for (let i = 0; i < pending.length; i++) {
    const r = pending[i];
    const p = document.createElement("p");
    p.textContent = who(r.user_id) + " - " + r.department + " - requested " +
      new Date(r.created_at).toLocaleDateString() + " ";

    const ok = document.createElement("button");
    ok.textContent = "Approve " + APPROVE_DAYS + " days";
    ok.addEventListener("click", async function () {
      if (!confirm("Approve " + who(r.user_id) + " for " + APPROVE_DAYS +
          " days? Check the receipt first.")) {
        return;
      }
      const res = await db.rpc("approve_jamb", {
        p_user: r.user_id,
        p_days: APPROVE_DAYS
      });
      if (res.error) {
        alert("Could not approve: " + res.error.message);
        return;
      }
      loadSubscribers();
    });
    p.appendChild(ok);

    const del = document.createElement("button");
    del.className = "delBtn";
    del.textContent = "Remove";
    del.addEventListener("click", async function () {
      if (!confirm("Remove this request? The student could choose a department again.")) {
        return;
      }
      const res = await db.from("jamb_requests").delete()
        .eq("user_id", r.user_id).select();
      if (res.error || !res.data || res.data.length === 0) {
        alert("Could not remove the request.");
        return;
      }
      p.remove();
    });
    p.appendChild(del);
    pBox.appendChild(p);
  }
  box.appendChild(pBox);

  const subs = document.createElement("div");
  subs.className = "group";
  const h1 = document.createElement("h3");
  h1.textContent = "JAMB subscribers (" + acc.data.length + ")";
  subs.appendChild(h1);
  for (let i = 0; i < acc.data.length; i++) {
    const a = acc.data[i];
    const live = new Date(a.expires_at) > new Date();
    const p = document.createElement("p");
    p.textContent = who(a.user_id) + " - " + a.department + " - " +
      (live ? "active until " : "expired ") +
      new Date(a.expires_at).toLocaleDateString() + " ";
    const del = document.createElement("button");
    del.className = "delBtn";
    del.textContent = "Remove";
    del.addEventListener("click", async function () {
      if (!confirm("Remove this student's JAMB access?")) {
        return;
      }
      const r = await db.from("jamb_access").delete()
        .eq("user_id", a.user_id).select();
      if (r.error || !r.data || r.data.length === 0) {
        alert("Could not remove access.");
        return;
      }
      p.remove();
    });
    p.appendChild(del);
    subs.appendChild(p);
  }
  box.appendChild(subs);

  const un = document.createElement("div");
  un.className = "group";
  const h2 = document.createElement("h3");
  h2.textContent = "Unused PINs (" + pins.data.length + ")";
  un.appendChild(h2);
  for (let i = 0; i < pins.data.length; i++) {
    const x = pins.data[i];
    const p = document.createElement("p");
    p.textContent = x.pin + " - " + x.department + " - " + x.days + " days" +
      (x.note ? " - " + x.note : "") + " ";
    const del = document.createElement("button");
    del.className = "delBtn";
    del.textContent = "Cancel";
    del.addEventListener("click", async function () {
      if (!confirm("Cancel this unused PIN?")) {
        return;
      }
      const r = await db.from("jamb_pins").delete().eq("id", x.id).select();
      if (r.error || !r.data || r.data.length === 0) {
        alert("Could not cancel the PIN.");
        return;
      }
      p.remove();
    });
    p.appendChild(del);
    un.appendChild(p);
  }
  box.appendChild(un);
}
  async function checkAdminSession() {
    const s = await db.auth.getSession();
    if (s.data.session) {
      startAdmin();
    }
  }
  checkAdminSession();
</script>
</body>
</html>
